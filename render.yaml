# Servicio web en Render con PostgreSQL externo en Neon.
services:
  - type: web
    name: mpm-portal
    runtime: node
    plan: free
    autoDeployTrigger: off
    # En el plan gratuito no hay preDeployCommand. Aplicar migraciones desde
    # un entorno controlado con DIRECT_DATABASE_URL antes de desplegar.
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # En un Blueprint existente sync:false NO reemplaza valores previos.
      # La URL pooled del usuario de aplicación se configura en Environment.
      # La URL directa del propietario se conserva solo fuera del servicio web
      # para migraciones y respaldos.
      - key: DATABASE_URL
        sync: false
      - key: MPM_MAINTENANCE_MODE
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
