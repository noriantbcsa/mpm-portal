# Configuración de Render para el corte hacia Neon. La base antigua de
# Render sigue declarada temporalmente para permitir reversión.
services:
  - type: web
    name: mpm-portal
    runtime: node
    plan: free
    autoDeployTrigger: off
    # En el plan gratuito no hay preDeployCommand. Aplicar migraciones desde
    # un entorno controlado con DIRECT_DATABASE_URL antes de desplegar.
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # En un Blueprint existente sync:false NO reemplaza valores previos.
      # Retirar la referencia fromDatabase y configurar ambas URL a mano en
      # Environment, sin guardar credenciales en Git.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: MPM_MAINTENANCE_MODE
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

# Conservar la base de Render durante la ventana de reversión. Retirarla de
# la configuración y del panel solo tras confirmar copias y estabilidad.
databases:
  - name: mpm-portal-db
    plan: free
