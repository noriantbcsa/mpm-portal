services:
  - type: web
    name: mpm-portal
    runtime: node
    plan: free
    # No corras `npm run db:seed` aquí: en producción, correrlo en cada
    # deploy es destructivo (ver docs/DEPLOYMENT.md). La siembra inicial del
    # catálogo real y las cuentas de prueba se corre una sola vez, a mano,
    # apuntando a esta base de datos.
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mpm-portal-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        sync: false

databases:
  - name: mpm-portal-db
    plan: free
