# Actualizaciones de dependencias como pull requests: el CI (`verify`) corre
# sobre cada una. Agrupadas para no abrir decenas de PR sueltos.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
